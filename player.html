const SUB_TEXT = "1\n00:00:00,000 --> 00:00:20,000\n<b><font color=\"#ff5900\">♥පරිවර්තනය සහ උපසිරැසි ගැන්වීම♥</font>\n<font color=\"#28ff69\">෴නයන බුද්ධික෴</font>\n<font color=\"#6638ff\">B a i s c o p e l k</font></b>\n\n2\n00:00:30,613 --> 00:00:33,199\nමන් මෙතනට මාරම\nකැමතියි, මොකද කිව්වොත්…\n\n3\n00:00:35,535 --> 00:00:38,955\nවීව් එක මරු, තේරුමක් නැතුවම.. ශික්.\n\n4\n00:00:39,664 --> 00:00:41,750\nඒකනේ, මෙතන ගොඩක්\nඇහැ ගැටෙන තැනක්නේ.\n\n5\n00:00:44,544 --> 00:00:48,339\nඅපහසුතාවෙට පත් වුනා\nනම් සමාවෙන්න ඕනෙ.\n\n6\n00:00:49,716 --> 00:00:54,262\nමේ අභිචෝදක කාර්යාලේ මන් දන්න\nමල්ලි කෙනෙක් ඉන්න හින්දා ආවේ.\n\n7\n00:00:59,559 --> 00:01:02,562\nඅන්තිමේදි බොන්ග්සන්\nඑකේ වැඩ ඉවරයක් වුනානේ.\n\n8\n00:01:03,813 --> 00:01:07,567\nසභාපතිතුමා ගොඩක් ලොකු තීරණයක් ගත්තේ.\n\n9\n00:01:09,277 --> 00:01:12,781\nදැන් අභිචෝදකතුමාට\nතීරණයක් ගන්න වෙයි වගේ.\n\n10\n00:01:13,990 --> 00:01:15,700\nතව කල් ඕනෙ.\n\n11\n00:01:15,784 --> 00:01:18,745\nතාත්තා එහෙම ලේසි පහසු කෙනෙක් නෙවේ.\n\n12\n00:01:19,245 --> 00:01:22,290\nතවත් පරක්කු කලොත් අවස්ථාව මග හැරේවි.\n\n13\n00:01:24,292 --> 00:01:27,212\nමොකවුනත් තේරීම අභිචෝදකතුමා අතේ.\n\n14\n00:01:28,421 --> 00:01:33,468\nදැන් වගේ ආතක් පාතක් නැති\nපිට එකෙක් වගේ ඉන්නවද...\n\n15\n00:01:34,469 --> 00:01:35,553\nනැත්තම්…\n\n16\n00:01:39,891 --> 00:01:43,228\nඅර ප්ලාසා එකේ අලුත් අයිතිකාරයා වෙනවද?\n\n17\n00:02:17,554 --> 00:02:20,932\n<b><font face=\"Bell MT\" color=\"#ff0012\">MERCY FOR NONE</font></b>\n\n18\n00:02:32,652 --> 00:02:35,280\nහු#ත, මැරුනා කියලනේ ආරංචි වුනේ.\n\n19\n00:02:36,698 --> 00:02:39,325\nඅර ලී ජූ වුන් කාරයා මට හි#වා නේද.\n\n20\n00:02:39,826 --> 00:02:42,745\nඔහොම ඉන්න, මල්ලිගේ කාරණේ ගැන...\n\n21\n00:02:50,086 --> 00:02:50,920\nහු#තයි!\n\n22\n00:03:12,358 --> 00:03:13,276\nගොඩ කාලෙකින්.\n\n23\n00:03:48,645 --> 00:03:49,854\nආපහු හම්බෙමු.\n\n24\n00:04:11,251 --> 00:04:14,379\nතව පොඩ්ඩෙන් දෙයියෝ\nගාවට යන්නයි වෙන්නේ.\n\n25\n00:04:20,385 --> 00:04:22,178\nනම් ගි ජුන්, ආ...\n\n26\n00:04:22,262 --> 00:04:26,140\nකටකතාවල විදියටම ආතල් පොරක්නේ මූ.\n\n27\n00:04:34,148 --> 00:04:35,817\n<font color=\"#11ebff\">අධ්‍යක්ෂ ලී ජූ වුන්</font>\n\n28\n00:04:35,900 --> 00:04:38,987\nඇයි එහෙම කලේ, හු##ගේ පුතෝ?\n\n29\n00:04:39,904 --> 00:04:43,324\nඉතින් මේ කාර් එකෙන් පැනලා\nගියපු එකාව හොයලා දෙන්න...\n\n30\n00:04:43,408 --> 00:04:44,867\nඒකද කියන්නේ?\n\n31\n00:04:45,368 --> 00:04:46,577\nමේ අන්තිම පාර.\n\n32\n00:04:47,704 --> 00:04:49,372\nආපහු මාව දකින්න වෙන එකක් නෑ.\n\n33\n00:04:59,465 --> 00:05:00,466\nමේ.. ගි ජුන්...\n\n34\n00:05:01,968 --> 00:05:05,179\nමන් වගේ බූරුවෙක් මෙච්චර කල්\nපණපිටින් ඉන්න හේතුව මොකද්ද දන්නවද?\n\n35\n00:05:09,976 --> 00:05:13,563\nකරන්න ඕනෙ මොකද්ද, නැත්තේ\nමොකද්ද කියලා මට හොදට තේරෙනවා.\n\n36\n00:05:14,939 --> 00:05:16,774\nමේක නම් අම්මපා හරියන වැඩක් නෙවේ.\n\n37\n00:05:17,275 --> 00:05:20,194\nමැරුනත් මට නම් මේක කරන්න\nබෑ, පොලිස්කාරයෙක් කිව්වනේ.\n\n38\n00:05:20,695 --> 00:05:23,281\nඋඹ නිකම්හරි පොලිස්කාරයෙක්\nඑක්ක පැටලුනොත් කෙලවිලා යයි.\n\n39\n00:05:23,781 --> 00:05:27,243\nගි සොක් එක්ක පැටලුන එක හොදද එතකොට?\n\n40\n00:05:29,996 --> 00:05:32,957\n<font color=\"#11ebff\">සැලසුම් සහ අයවැය දෙපාර්තමේන්තුව\nපොලිස් අධිකාරී චා යොන්ග් දෝ</font>\n\n41\n00:05:37,253 --> 00:05:38,379\nඔව්.\n\n42\n00:05:39,630 --> 00:05:43,760\n- ගෙදර යන්නැද්ද?\n- ඔව්, තව වැඩ ටිකක් තියේ, ඔයා මුලින් යන්න.\n\n43\n00:05:44,344 --> 00:05:45,678\nහරි, හෙට හම්බෙමු සර්.\n\n44\n00:05:45,762 --> 00:05:47,138\nසුබ රාත්‍රියක්.\n\n45\n00:06:00,818 --> 00:06:04,030\nඔයාට පින්සිද්ධ වෙන්න නම් ගි\nජුන්ව හම්බෙන්න පුළුවන් වුනා.\n\n46\n00:06:04,947 --> 00:06:07,909\nමේක සභාපතිගේ විදිය නෙවේනේ.\n\n47\n00:06:08,409 --> 00:06:11,496\nපිටිපස්සට වෙලා මෙහෙම\nහු#තේ වැඩ කරන්නේ මොකෝ.\n\n48\n00:06:13,289 --> 00:06:15,249\nළගදිම අපිත් හම්බෙමු.\n\n49\n00:06:29,597 --> 00:06:30,848\nවැඩට යන්නැද්ද?\n\n50\n00:06:31,682 --> 00:06:33,768\nඅධ්‍යක්ෂ මණ්ඩල රැස්වීමක් කැදෙව්වලු නේ.\n\n51\n00:06:39,399 --> 00:06:42,652\nමන් දැන් එහෙට යනවා.. තාත්තා වෙනුවට.\n\n52\n00:06:45,363 --> 00:06:47,281\nආපහු කියපන්, කොහෙද යනවා කිව්වේ?\n\n53\n00:06:49,117 --> 00:06:52,203\nමේ ගැන කොහෙන්ද\nකියන්න පටන් ගන්න ඕනෙ.\n\n54\n00:06:53,788 --> 00:06:55,665\nමිස්ටර් කිම්ව මුලින්ම හම්බුන දවසේ ඉදන්ද?\n\n55\n00:06:56,416 --> 00:07:00,002\nඉතින්.. එකතු වෙලා සෙල්ලම අනිත්\nපැත්ත ගහන්න කතා කරගත්ත දවසේ ඉදන්ද?\n\n56\n00:07:00,503 --> 00:07:02,171\nනැත්තම්...\n\n57\n00:07:03,381 --> 00:07:06,092\nතාත්තගේ තැන ගන්නවයි කියලා\nමුල්ම පාරට තීරණය කරපු දවසේ ඉදන්ද?\n\n58\n00:07:09,095 --> 00:07:11,222\nඕයි පිස්සු බූරුවෝ!\n\n59\n00:07:12,014 --> 00:07:14,517\nචා යොන්ග් දෝ මොන වගේ\nපිස්සු යකෙක්ද කියලා දන්නවද?\n\n60\n00:07:15,143 --> 00:07:16,769\nඇයි ඒ මනුස්සයට දොස් කියන්නේ?\n\n61\n00:07:17,353 --> 00:07:20,106\nමේ සේරම තාත්තා මාව\nකොන් කරපු හින්දනේ වුනේ.\n\n62\n00:07:20,940 --> 00:07:24,902\nඕයි බූරුවෝ, මේ ජීවිතේ.. මේ\nතනතුර හැමදාටම නරක හීනයක්!\n\n63\n00:07:24,986 --> 00:07:28,072\nමන් හැමදේම උඹ වෙනුවෙනුයි කලේ!\n\n64\n00:07:28,156 --> 00:07:31,367\nඋඹ හරි මන් වගේ ජීවත් වෙනවා\nදකින්න ඕනෙ නැති හින්දයි බූරුවෝ!\n\n65\n00:07:34,370 --> 00:07:36,122\nඒක තාත්තගේ අදහසනේ.\n\n66\n00:07:37,915 --> 00:07:39,208\nමගේ අදහස නෙවේනේ.\n\n67\n00:07:41,711 --> 00:07:42,837\nමට...\n\n68\n00:07:43,463 --> 00:07:45,465\nමට හැමවෙලේම තාත්තා\nවගේ වෙන්නයි ඕනෙ වුනේ.\n\n69\n00:07:46,757 --> 00:07:48,551\nතාත්තගේ තැනේ වාඩිවෙන්නයි ඕනෙ වුනේ.\n\n70\n00:07:49,135 --> 00:07:51,971\nඑකපාරක්වත් අතෑරියේ නෑ මන්, ඒත් තාත්තා…\n\n71\n00:07:53,181 --> 00:07:56,809\nනිකම්.. හෙන ලේසියෙන්\nකොහෙවත් යන එකෙක්ට දුන්නා.\n\n72\n00:08:08,279 --> 00:08:09,489\n<font color=\"#11ebff\">නම: ලී ජූ වුන්</font>\n\n73\n00:08:09,572 --> 00:08:11,491\n<font color=\"#11ebff\">සෝදිසි වරෙන්තුව</font>\n\n74\n00:08:13,910 --> 00:08:15,036\nබූරුවෝ!\n\n75\n00:08:16,370 --> 00:08:18,581\nමේ කඩදාසි කෑල්ලකින් මාව\nනවත්තන්න පුළුවන් කියලද හිතන්නේ උඹ?\n\n76\n00:08:19,207 --> 00:08:21,584\nශින් ගෝ මුන් අයියයි, පාක් සන්ග් මුයි\nඋඹ කියන දේ අහයි කියලද හිතන්නේ?\n\n77\n00:08:21,667 --> 00:08:22,960\nඅහන්නේ නැත්තම්...\n\n78\n00:08:24,712 --> 00:08:26,923\nඅහන්න සලස්වන්නනේ තියෙන්නේ.\n\n79\n00:08:33,763 --> 00:08:35,139\nබලන් ඉන්න.\n\n80\n00:08:35,223 --> 00:08:36,724\nපිටත් වෙන්න ඕනෙ සර්.\n\n81\n00:08:45,983 --> 00:08:47,068\nසමාවෙන්න සර්.\n\n82\n00:09:16,931 --> 00:09:18,933\nඔව්, අන් මහත්තයා.\n\n83\n00:09:19,642 --> 00:09:21,227\nගොඩක් බලන් ඉන්න සැලැස්සුවනේ.\n\n84\n00:09:22,103 --> 00:09:24,897\nනම් ගි ජුන් එක්ක තියෙන නරක\nසම්බන්ධේ ඉවරයක් කරලා දාමු දැන්.\n\n85\n00:09:27,608 --> 00:09:29,235\nමගේ කාර් එකෙන් යන්න.\n\n86\n00:09:41,038 --> 00:09:43,666\nඑතකොට නම් ගි ජුන්\nතනියම හොයාගෙන එයි.\n\n87\n00:09:43,749 --> 00:09:50,756\n<font color=\"#11ebff\">අවසරලත් වාහන පමණි</font>\n\n88\n00:09:53,926 --> 00:09:56,512\nමිස්! මේ බලන්න.\n\n89\n00:10:08,149 --> 00:10:09,609\nඒයි, හොයාගත්තා පොලිස්කාරයව.\n\n90\n00:10:10,109 --> 00:10:12,111\nඇඩ්‍රස් එක එව්වා, දැන්\nඑව්ව මැසේජ් එක බලන්න.\n\n91\n00:10:12,612 --> 00:10:14,030\nහරි, තේරුනා.\n\n92\n00:10:14,614 --> 00:10:17,742\nඒක නෙවේ ගි ජුන්, උඹ\nකොච්චර දුර යනවද තව?\n\n93\n00:10:18,868 --> 00:10:19,994\nඉවරයක් කරන්න වෙනවා...\n\n94\n00:10:21,621 --> 00:10:22,622\nහැමදෙයක්ම.\n\n95\n00:10:31,422 --> 00:10:32,715\nඑයා මොකද මෙතන කරන්නේ?\n\n96\n00:10:34,425 --> 00:10:35,593\nසභාපතිතුමා කෝ?\n\n97\n00:10:35,676 --> 00:10:36,510\n<font color=\"#11ebff\">ජූවුන්</font>\n\n98\n00:10:56,906 --> 00:11:00,701\nහැමෝම.. ඉස්සරහට හොදින් වැඩ කරමු.\n\n99\n00:11:17,802 --> 00:11:20,221\nමොකද්ද වෙන්නේ කියලා දැන් තේරෙනවා.\n\n100\n00:11:21,097 --> 00:11:24,558\nසොන්ග් චොල්ව තමන්ගේ පැත්තට අරන්\nකුමන්ත්‍රණයක් කරන්න වගේ සැලසුම් කරන්නේ.\n\n101\n00:11:24,642 --> 00:11:26,894\nපොඩි මහත්තයා, කාලේ අපරාදේ.\n\n102\n00:11:27,395 --> 00:11:30,481\nපොඩි මහත්තයා සැපේ පොත්\nපෙරල පෙරල ඉදපු වෙලාවේ අපි...\n\n103\n00:11:31,482 --> 00:11:34,902\nසභාපතිතුමත් එක්ක ජීවිතේ\nපරදුවට තියලා තියේ අනන්ත වාරයක්.\n\n104\n00:11:35,903 --> 00:11:38,447\nපොඩි මහත්තයව අපේ\nකෙනෙක් විදියට දකින...\n\n105\n00:11:40,783 --> 00:11:42,159\nඑක්කෙනෙක්වත් මෙතන නැහැ.\n\n106\n00:11:44,578 --> 00:11:46,580\nපිළිගන්න අමාරු අයට...\n\n107\n00:11:48,207 --> 00:11:49,500\nයන්න පුළුවන්.\n\n108\n00:11:59,093 --> 00:12:01,053\nමොනාද බලන් ඉන්නේ? හැමෝම යං.\n\n109\n00:12:05,850 --> 00:12:08,978\nකවුද තොපිලා? පැත්තකට වෙයන් කිව්වම!\n\n110\n00:12:13,899 --> 00:12:14,775\nමොකද්ද වුනේ?\n\n111\n00:12:16,777 --> 00:12:18,279\nමන් තාත්තා වගේ නෙවේ.\n\n112\n00:12:22,950 --> 00:12:27,788\nතාත්තා එයාගේ අත් ජරා\nකරගන්න අකැමති වුනාට...\n\n113\n00:12:28,289 --> 00:12:30,583\nමම නම්.. එහෙම නැහැ.\n\n114\n00:12:31,667 --> 00:12:32,960\nඕනෙ නම්...\n\n115\n00:12:33,753 --> 00:12:35,045\nඅනිවාරෙන්...\n\n116\n00:12:36,422 --> 00:12:38,174\nඅත් ජරා කරගන්න පුළුවන්.\n\n117\n00:13:26,096 --> 00:13:27,139\nඅයියේ.\n\n118\n00:13:28,265 --> 00:13:29,391\nඇයි එහෙම කලේ?\n\n119\n00:13:30,684 --> 00:13:32,394\nඅවුරුදු 11කට කලින් එදා ගැන කියන්නේ.\n\n120\n00:13:34,021 --> 00:13:35,981\nඑදා නිකම්ම මාව මරලා දාන්නයි තිබ්බේ?\n\n121\n00:13:41,946 --> 00:13:42,988\nහු#ත.\n\n122\n00:13:45,199 --> 00:13:46,867\nලැජ්ජාවේ බෑ.\n\n123\n00:14:23,529 --> 00:14:24,780\nඉක්මනට ඉවරයක් කරලා දාමු.\n\n124\n00:14:54,018 --> 00:14:54,852\nඅරගන්නවා.\n\n125\n00:16:00,834 --> 00:16:02,252\nනවත්තමු අයියේ.\n\n126\n00:16:18,602 --> 00:16:19,645\nඒකනේ ඉතින්...\n\n127\n00:16:24,775 --> 00:16:26,485\nඑදා මාව මරලා දාන්නනේ තිබ්බේ.\n\n128\n00:17:00,019 --> 00:17:01,061\nහු#ත.\n\n129\n00:17:02,104 --> 00:17:04,023\nඅන්තිම වෙනකම්ම ලැජ්ජ කරනවද?\n\n130\n00:17:30,883 --> 00:17:31,800\nගි ජුන්.\n\n131\n00:17:35,095 --> 00:17:36,221\nමේ ෆීල්ඩ් එක…\n\n132\n00:17:39,600 --> 00:17:40,893\nහැමෝම...\n\n133\n00:17:42,311 --> 00:17:43,896\nමැරුනමයි ඉවර වෙන්නේ.\n\n134\n00:17:46,398 --> 00:17:47,232\nදන්නවා.\n\n135\n00:17:58,368 --> 00:17:59,536\nගිහින්...\n\n136\n00:18:02,414 --> 00:18:03,540\nහම්බෙලා බලන්න.\n\n137\n00:18:07,127 --> 00:18:09,963\n<font color=\"#11ebff\">මිස්ටර් කිම්</font>\n\n138\n00:18:15,761 --> 00:18:16,595\nසාදරයෙන් පිළිගන්නවා.\n\n139\n00:18:21,100 --> 00:18:23,060\nඅන්තිම සමුගැනීම නේ.\n\n140\n00:18:23,811 --> 00:18:25,521\nඅන්තිමේදි එහෙම වුනානේ.\n\n141\n00:18:26,647 --> 00:18:27,564\nඉතින්...\n\n142\n00:18:28,607 --> 00:18:29,733\nපසුතැවෙනවද...\n\n143\n00:18:30,943 --> 00:18:32,486\nදැන් ඔතනට වෙලා ඉන්න එක ගැන?\n\n144\n00:18:37,157 --> 00:18:40,452\nකොහොමවුනත් සභාපතිතුමා නම්\nහෙනම ආත්මාර්ථකාමී මිනිහෙක්.\n\n145\n00:18:41,703 --> 00:18:43,705\nඑච්චරට අවස්ථා තිබිලත්...\n\n146\n00:18:44,373 --> 00:18:47,126\nඑක පාරක්වත් වුන\nවැරැද්දක් හරිගැස්සුවේ නෑ...\n\n147\n00:18:48,085 --> 00:18:50,295\nසේරම දැන දැනත්, මොකද දන්නවද?\n\n148\n00:18:52,089 --> 00:18:53,465\nමිහිරි හින්දා.\n\n149\n00:18:54,758 --> 00:18:58,262\nසභාපතිතුමා ළග තියෙන ඔය හැමදේම\nනැති කරගන්න අකැමති වුන හින්දා.\n\n150\n00:19:01,557 --> 00:19:03,767\nඅතේ ලේ ගාවගන්නද හදන්නේ?\n\n151\n00:19:03,851 --> 00:19:07,146\nඔව් ඉතින්, කලින් සැලැස්මේ\nතිබ්බේ නැති දෙයක් නම් තමා.\n\n152\n00:19:08,313 --> 00:19:10,482\nඒත් සභාපතිතුමා ජීවතුන් අතර ඉදියොත්...\n\n153\n00:19:10,983 --> 00:19:12,943\nමට පොඩ්ඩක් අනතුරුදායකයි.\n\n154\n00:19:14,486 --> 00:19:15,654\nතේරෙනවා නේද?\n\n155\n00:19:17,447 --> 00:19:19,950\nඅර අභිචෝදක පුතන්ඩියා ගැන\nවැඩිය කරදර වෙන්න ඕනෙ නෑ.\n\n156\n00:19:20,450 --> 00:19:21,785\nමන් හොදට බලාගන්නම් එයාව.\n\n157\n00:19:21,869 --> 00:19:25,330\nගුම් සොන්ව මේකට ගාවගෙන\nඋඹ ලොකු වැරැද්දක් කලේ.\n\n158\n00:19:25,414 --> 00:19:26,373\nඑහෙමද?\n\n159\n00:19:26,874 --> 00:19:29,001\nමන් නම් හිතන්නේ නැහැ.\n\n160\n00:19:36,758 --> 00:19:37,593\nහරි.\n\n161\n00:19:39,344 --> 00:19:40,721\nහරි, සන්සුන් වෙන්න.\n\n162\n00:19:43,724 --> 00:19:45,517\nතෝ බැල්ලිගේ පුතා.\n\n163\n00:20:50,666 --> 00:20:51,541\nසභාපතිතුමා.\n\n164\n00:20:58,298 --> 00:20:59,341\nහෙල්ලෙන්න එපා!\n\n165\n00:21:19,528 --> 00:21:22,239\nතමුන්ව සභාපති ලී ජූ වුන් ඝාතනය\nසම්බන්ධයෙන් අත්අඩංගුවට ගන්නවා.\n\n166\n00:21:22,322 --> 00:21:23,156\nලොක්කා.\n\n167\n00:21:23,240 --> 00:21:26,159\nතමුන් කියන හැමදෙයක්ම උසාවියෙදි තමුන්ට\nවිරුද්ධව පාවිච්චි කරන්න පුළුවන් වගේම...\n\n168\n00:21:26,243 --> 00:21:28,537\nතමුන්ට නීතිඥයෙක් ලබාගන්න පුළුවන් වගේම...\n\n169\n00:21:28,620 --> 00:21:30,747\nනිහඩව ඉන්නත් අයිතිය තියෙනවා.\n\n170\n00:21:31,999 --> 00:21:32,833\nඑළියට වෙලා ඉන්න.\n\n171\n00:21:32,916 --> 00:21:35,127\nමේ මොකද?\n\n172\n00:21:39,965 --> 00:21:42,467\nඇයි එහෙම කලේ? ආ?\n\n173\n00:21:46,722 --> 00:21:49,683\nඅපි ඉක්මනටම ආයේ හම්බුනානේ.\n\n174\n00:21:50,642 --> 00:21:51,476\nනේද?\n\n175\n00:21:54,354 --> 00:21:55,188\nමොකෝ?\n\n176\n00:21:56,982 --> 00:21:58,317\nඅසාධාරණයිද?\n\n177\n00:22:20,797 --> 00:22:21,631\nඔව්.\n\n178\n00:22:57,334 --> 00:22:59,586\nමේ නාකියගේ මාර හයියක්නේ තියෙන්නේ.\n\n179\n00:23:02,214 --> 00:23:06,051\nඒක තමා ඉතින්, මොන එහෙකටද\nඑහෙම නාඩගමක් නටන්න ගියේ?\n\n180\n00:23:06,551 --> 00:23:07,386\nඈ?\n\n181\n00:23:08,804 --> 00:23:11,223\nපොඩ්ඩක් දන්නෑ වගේ ඉන්න බැරි වුනාද?\n\n182\n00:23:14,267 --> 00:23:15,435\nනිකම්...\n\n183\n00:23:16,186 --> 00:23:19,606\nදැක්කේ නෑ වගේ ඉන්න තිබ්බනේ.\n\n184\n00:23:20,774 --> 00:23:24,444\nඅවුරුදු දහයකටත් වැඩිය එහෙමනේ ඉදියේ.\n\n185\n00:23:27,489 --> 00:23:29,074\nඋඹේ පුතන්ඩියා හින්දා තමා මේ සේරම.\n\n186\n00:23:34,371 --> 00:23:35,288\nපරිස්සමට යන්න.\n\n187\n00:23:37,666 --> 00:23:38,500\nපුතන්ඩියා ගැන...\n\n188\n00:23:38,583 --> 00:23:39,918\nකරදර වෙන්නේ නැතුව.\n\n189\n00:23:48,385 --> 00:23:49,511\nඅපේ සැලැස්ම...\n\n190\n00:23:50,679 --> 00:23:53,473\nනම් ගි ජුන් මහත්තයා හින්දයි\nකරගන්න පුළුවන් වුනේ.\n\n191\n00:23:54,516 --> 00:23:55,934\nඅවුරුදු 11කට කලිනුත්...\n\n192\n00:23:57,185 --> 00:23:58,145\nදැනුත්.\n\n193\n00:23:58,645 --> 00:24:00,313\nඒකද මැරුවේ?\n\n194\n00:24:02,441 --> 00:24:04,651\nමාව ගාවගන්නද...\n\n195\n00:24:05,986 --> 00:24:07,028\nගි සොක්ව…\n\n196\n00:24:09,573 --> 00:24:10,615\nමරලා දැම්මේ?\n\n197\n00:24:15,829 --> 00:24:18,290\nඅන්තිමේදි එහෙම වුනාට...\n\n198\n00:24:19,332 --> 00:24:21,460\nඇත්තම කිව්වොත් අපේ\nසැලැස්ම නොවුනත්...\n\n199\n00:24:22,419 --> 00:24:24,296\nමල්ලි කොහොමත් මැරෙන්නයි ඉදියේ.\n\n200\n00:24:24,379 --> 00:24:25,213\nමොකද කිව්වොත්...\n\n201\n00:24:27,674 --> 00:24:30,594\nලී සභාපති තමන්ගේ අනුප්‍රාප්තිකයා\nවිදියට එයාව තෝරගත්තට පස්සේ...\n\n202\n00:24:31,470 --> 00:24:34,181\nනම් ගි සොක්ට ගන්න පුළුවන්\nමේ දෙකෙන් එක තීරණයයි.\n\n203\n00:24:34,264 --> 00:24:35,265\nඑක්කෝ මැරෙනවා...\n\n204\n00:24:36,975 --> 00:24:38,685\nනැත්තම් සිංහාසනයේ ඉදගන්නවා.\n\n205\n00:24:46,151 --> 00:24:47,402\nඇහුවේ නෑනේ.\n\n206\n00:24:49,070 --> 00:24:52,532\nමන් මේ ටිකකට කලින් \"අපේ\nසැලැස්ම\" කියලනේ කිව්වේ.\n\n207\n00:24:53,909 --> 00:24:55,285\nදැනගන්න ඕනෙ නැද්ද...\n\n208\n00:24:58,330 --> 00:24:59,623\nමන් ඇරුනම...\n\n209\n00:25:00,999 --> 00:25:02,667\nඅනිත් කෙනා කවුද කියලා?\n\n210\n00:25:14,095 --> 00:25:15,722\nවිමර්ශන අංශෙන් මම.\n\n211\n00:25:18,058 --> 00:25:19,726\nනම් ගි ජුන්ව...\n\n212\n00:25:20,435 --> 00:25:23,313\nදැන් ඉදන් අපේ විමර්ශන අංශය භාරගන්නවා.\n\n213\n00:25:57,847 --> 00:26:00,475\n<font color=\"#11ebff\">අලුත්වැඩියා කරමින් පවතී\nඇතුල්වීම තහනම්</font>\n\n214\n00:26:06,439 --> 00:26:07,816\nමෙහෙදි මරන්නද හදන්නේ?\n\n215\n00:26:17,242 --> 00:26:18,660\nඒයි ඒයි ඒයි!\n\n216\n00:26:18,743 --> 00:26:20,453\nඅම්මපා මුට නම්.\n\n217\n00:26:42,225 --> 00:26:43,226\nඅතෑරපිය!\n\n218\n00:26:47,731 --> 00:26:48,565\nඒයි ඒයි!\n\n219\n00:27:28,772 --> 00:27:30,940\nතෝ ඉදලා ඉවරයි දැන්, පර බල්ලෝ.\n\n220\n00:27:52,962 --> 00:27:54,881\nපොඩ්ඩක් පුදුම වුනා වගේවත් ඉදපන්කෝ.\n\n221\n00:27:56,257 --> 00:27:57,967\nමෙහෙට කොහොමද හොයාගෙන ආවේ?\n\n222\n00:27:59,219 --> 00:28:02,722\nචා යොන්ග් දෝගෙන් කෝල් එකක්\nආවා.. මේක සුද්ද කරලා දාන්න කියලා.\n\n223\n00:28:03,473 --> 00:28:06,059\nඋඹ ගැන ගානට බලාගත්තොත් ලොකු\nගානක් දෙන කතාවක්ද කොහෙද කිව්වා.\n\n224\n00:28:06,142 --> 00:28:07,602\nහු#ත, මන් නම් දන්නෑ.\n\n225\n00:28:08,103 --> 00:28:09,104\nඉතින්...\n\n226\n00:28:10,063 --> 00:28:11,481\nඇයි මට උදව් කරන්නේ?\n\n227\n00:28:17,320 --> 00:28:18,738\nශිම් සොන්ග් වොන් කෝල් කලා.\n\n228\n00:28:19,364 --> 00:28:22,158\nනම් ගි ජුන් එතනම මැරිලලු.\n\n229\n00:28:23,785 --> 00:28:25,078\nසෙටින්ග් එක?\n\n230\n00:28:25,161 --> 00:28:27,580\nඋමං මාර්ගෙකදි වුන කාර් ඇක්සිඩන්ට්\nඑකක් විදියට ඉවර කරනවලු.\n\n231\n00:28:30,458 --> 00:28:31,501\nආ එහෙමද.\n\n232\n00:28:32,544 --> 00:28:33,628\nහොදට කලා.\n\n233\n00:28:44,514 --> 00:28:45,974\nහු#ත.\n\n234\n00:28:47,308 --> 00:28:49,436\nකාලා බීලා ජීවත් වෙන්න තියෙන අමාරුවක්.\n\n235\n00:28:50,812 --> 00:28:51,646\nචා යොන්ග් දෝ...\n\n236\n00:28:52,439 --> 00:28:56,651\nපොලීසියේ වැදගත් දෙපාර්තමේන්තුවක් විදියට නම ගිහින්\nතියෙන සැලසුම් සහ අයවැය දෙපාර්තමේන්තුවේ මැනේජර් කෙනෙක්.\n\n237\n00:28:57,527 --> 00:28:58,820\nවැඩේ කියන්නේ...\n\n238\n00:28:59,404 --> 00:29:01,197\nසාමාන්‍යයෙන් මැනේජර් කෙනෙක් වුනාම...\n\n239\n00:29:01,281 --> 00:29:04,367\nඅවුරුදු කීපයක් ඇතුලත උසස්\nවීමක් හරි, මාරු වීමක් හරි හම්බෙනවා.\n\n240\n00:29:04,993 --> 00:29:07,704\nඒත් චා යොන්ග් දෝ.. ඌ\nඅවුරුදු 11ක් තිස්සේ එතනමයි.\n\n241\n00:29:08,705 --> 00:29:11,374\nකොහොමත් පොලිස් විශ්ව විද්‍යාලේ\nගියපු එකෙක් නෙවේ හින්දා...\n\n242\n00:29:11,458 --> 00:29:14,711\nඋසස් වීම් හම්බෙන එකෙත් සීමාවක්\nතියෙන හින්දා හිතාමතාම ඉන්න ඇති.\n\n243\n00:29:15,962 --> 00:29:19,966\nඉතින් අවුරුදු 11ක් තිස්සේ ජූවුන් එකෙයි,\nබොන්ග්සන් එකෙයි වැඩ යටගැහුවේ ඌ නේ.\n\n244\n00:29:21,217 --> 00:29:22,051\nඔව්.\n\n245\n00:29:23,845 --> 00:29:25,889\nමන් අහපු ප්‍රශ්නෙට තාම උත්තරයක් දුන්නෑ.\n\n246\n00:29:27,515 --> 00:29:28,892\nඇයි මට උදව් කරන්නේ?\n\n247\n00:29:32,604 --> 00:29:34,022\nඋඹ මැරෙන්න වුනත් පුළුවන්නේ.\n\n248\n00:29:37,192 --> 00:29:38,193\nඒක නේන්නම්.\n\n249\n00:29:40,195 --> 00:29:41,029\nආ හරිනේ.\n\n250\n00:29:44,324 --> 00:29:46,743\nමේ උඹට පාවිච්චි කරන්න\nපුළුවන් බර්නර් ෆෝන් එකක්.\n\n251\n00:29:47,243 --> 00:29:48,661\nතව...\n\n252\n00:29:49,579 --> 00:29:52,290\nමේ.. ලී ජූ වුන් පාවිච්චි කරපු පයිප් එක.\n\n253\n00:29:52,999 --> 00:29:54,959\nඋඹට වටින දෙයක් නේ?\n\n254\n00:29:56,628 --> 00:29:57,462\nමන්...\n\n255\n00:29:58,505 --> 00:30:02,050\nමගේ බෙල්ල ගහලා යන්න කලින්\nටික කාලෙකට රට ගිහින් ඉන්නවා.\n\n256\n00:30:03,676 --> 00:30:05,011\nමොකද්ද කියන්නේ කියලා තේරෙනවනේ?\n\n257\n00:30:08,348 --> 00:30:09,265\nඉක්මනට පලයන්.\n\n258\n00:30:27,158 --> 00:30:28,368\nපරිස්සමට යන්න එහෙනම්.\n\n259\n00:30:29,911 --> 00:30:31,663\nපුතන්ඩියා ගැන කරදර වෙන්න එපා.\n\n260\n00:30:41,589 --> 00:30:42,966\nමන් ඒ ගැන බලාගන්නම්.\n\n261\n00:30:43,049 --> 00:30:44,425\nඑපා, දැන්ම.\n\n262\n00:30:49,305 --> 00:30:52,642\nචා යොන්ග් දෝ හංගගෙන ඉන්න\nඅපේ ජූවුන් එකේ රහස් ලිපිගොනු...\n\n263\n00:30:53,309 --> 00:30:55,478\nඉස්සෙල්ලම ඒවා හොයාගෙන ඉන්න ඕනෙ.\n\n264\n00:31:05,780 --> 00:31:08,366\n<font color=\"#11ebff\">සෝදිසි වරෙන්තුව\nචා යොන්ග් දෝ</font>\n\n265\n00:31:15,415 --> 00:31:19,419\n<b><font color=\"#b90000\">සෝල් පුරවර පොලීසිය</font></b>\n\n266\n00:31:20,003 --> 00:31:20,837\nයං.\n\n267\n00:31:23,631 --> 00:31:24,966\nඅභිචෝදක කාර්යාලෙන් මේ.\n\n268\n00:31:30,471 --> 00:31:33,725\nඉක්මන් කරමු හැමෝම,\nතට්ටු එහෙම හොදට බලන්න.\n\n269\n00:31:33,808 --> 00:31:35,226\nකාගෙවත් කෝල් උස්සන්නේ නෑලු.\n\n270\n00:31:35,310 --> 00:31:37,437\nඉව වැටිලද කොහෙද ඌට.\n\n271\n00:31:38,104 --> 00:31:39,564\nඑක දෙයක්වත් ඉතුරු කරන්නැතුව...\n\n272\n00:31:39,647 --> 00:31:41,399\n- හැමදේම අරගන්නවා.\n- සේප්පුව නම් ගෙනියන්න එපා.\n\n273\n00:31:41,482 --> 00:31:42,442\nමේ...\n\n274\n00:31:42,525 --> 00:31:45,361\nචා යොන්ග් දෝ ආවේ නැත්තම්\nඔයාලයි අමාරුවේ වැටෙන්නේ.\n\n275\n00:31:47,947 --> 00:31:49,032\nඒ මොකද වෙන්නේ?\n\n276\n00:31:49,908 --> 00:31:50,825\nඉක්මන් කරලා යනවලා.\n\n277\n00:31:56,539 --> 00:31:59,042\nහු#ත, පිස්සු හැදෙනවා.\n\n278\n00:32:00,668 --> 00:32:01,586\nඕ.. ඇයි?\n\n279\n00:32:01,669 --> 00:32:04,422\nසර්, දැන් ඔෆිස් එකට එන්න එපා.\n\n280\n00:32:04,923 --> 00:32:07,008\nඅභිචෝදකෙන් සෝදිසි කරන්න වැටලුවා.\n\n281\n00:32:08,384 --> 00:32:09,928\n- සර්?\n- හු#තයි.\n\n282\n00:32:16,351 --> 00:32:17,810\nඅභිචෝදක මහත්තයෝ...\n\n283\n00:32:17,894 --> 00:32:20,355\nඇයි මේ පිටට පිහියෙන් අනින්නේ?\n\n284\n00:32:20,438 --> 00:32:23,149\nමන් කිව්වනේ.. මන් මට කරන්න\nතියෙන දේ කරනවා කියලා.\n\n285\n00:32:23,232 --> 00:32:24,233\nඒයි හු...\n\n286\n00:32:27,779 --> 00:32:28,863\nනැහැ...\n\n287\n00:32:29,781 --> 00:32:32,492\nමොකක් හින්දා මෙහෙම කරනවද\nකියලා හරියට තේරෙන්නේ නම් නෑ.\n\n288\n00:32:33,409 --> 00:32:35,662\nඒත් මේක දැනට මෙතනින් නතර කරගමු, නේ?\n\n289\n00:32:36,579 --> 00:32:38,581\nමෙච්චර කල් හොදට ඉදලා\nමොකද මේ එකපාරටම වුනේ?\n\n290\n00:32:38,665 --> 00:32:41,709\nමන් ඇත්තටම දැනගන්නේ\nනැති වෙයි කියලද හිතුවේ?\n\n291\n00:32:46,881 --> 00:32:47,799\nමගේ තාත්තව...\n\n292\n00:32:49,509 --> 00:32:51,386\nනම් ගි ජුන් නෙවේනේ මරලා දැම්මේ.\n\n293\n00:32:52,095 --> 00:32:54,847\nතව කල් ඕනෙ කිව්වම\nඑතකන් බලන් ඉන්න බැරුව...\n\n294\n00:32:57,642 --> 00:32:58,893\nඅභිචෝදකතුමා.\n\n295\n00:32:59,811 --> 00:33:03,064\nමොකක් හරි වැරදි වැටහීමක් තියෙනවා වගේ.\n\n296\n00:33:03,147 --> 00:33:04,107\nවැරදි වැටහීමක්?\n\n297\n00:33:05,149 --> 00:33:07,443\nඒකත් ඇත්ත, ඔයාගේ විදිය ඉතින් ඒකනේ.\n\n298\n00:33:07,527 --> 00:33:11,155\nවැරදි වැටහීමක් ඇති කරනවා, ගැටුමක්\nඇති කරලා මිනිස්සුන්ව කොටවනවා.\n\n299\n00:33:11,239 --> 00:33:14,033\nඉස්සෙල්ලම හම්බෙලා කතා කරමු අපි, හාද?\n\n300\n00:33:14,117 --> 00:33:15,243\nඊළග පාර බලමු...\n\n301\n00:33:15,827 --> 00:33:16,953\nපුළුවන් වුනොත්.\n\n302\n00:33:25,837 --> 00:33:27,422\nහු#තයි.\n\n303\n00:33:36,014 --> 00:33:39,267\n<b>ඔබ ඇමතූ දුරකථනය ක්‍රියා විරහිත කොට ඇත...</b>\n\n304\n00:33:43,438 --> 00:33:47,108\nඕයි පර බල්ලෝ, තොට මන් ආපහු\nකෝල් කරන්න කියලා කිව්වනේ.\n\n305\n00:33:47,608 --> 00:33:51,195\nතොට ආපහු ඉන්ටර්පෝල් වෝන්ටඩ්\nලිස්ට් එකට වැටෙන්නද ඕනෙ?\n\n306\n00:33:52,280 --> 00:33:53,948\nදැන්ම වරෙන් මෙහෙට.\n\n307\n00:33:58,411 --> 00:34:00,621\nචා මහත්තයට කේන්ති ගිහින්ද?\n\n308\n00:34:01,956 --> 00:34:03,458\nකෙලින්ම කාරණෙට එනවා.\n\n309\n00:34:04,584 --> 00:34:07,086\nමෙහෙම හම්බුනයි කියලා දෙන්නගෙන්\nඑකෙක්ටවත් වෙන සෙතක් නෑ.\n\n310\n00:34:07,170 --> 00:34:08,337\n\"කනෙයමා.\"\n\n311\n00:34:09,380 --> 00:34:10,715\nඔයාගේ ඇත්ත නම නේ?\n\n312\n00:34:12,050 --> 00:34:14,010\nශිමානේවල හිටපු කුලී ඝාතකයෙක්.\n\n313\n00:34:14,093 --> 00:34:16,179\nකොරියානු-ජපන් ජාතිකයෙක්,\nකොරියන් නම කිම් ගිල් ලොක්.\n\n314\n00:34:16,763 --> 00:34:18,765\nඉන්ටර්පෝල් එකේ\nවෝන්ටඩ් ලිස්ට් එකේ ඉද්දි...\n\n315\n00:34:18,848 --> 00:34:22,060\nචා යොන්ග් දෝ නම සුද්ද කරලා\nදීලා හවුල්කාරයෙක් කරගත්තා.\n\n316\n00:34:23,311 --> 00:34:25,313\nහවුල්කාරයෙක් කියලා නමට කිව්වට...\n\n317\n00:34:25,396 --> 00:34:27,440\nඌ ඔයාව පාවිච්චි කරන එක\nනේද ඇත්තටම කරන්නේ?\n\n318\n00:34:31,402 --> 00:34:33,154\nමන් ඔයාට කොරියාවේ\nජීවත් වෙන්න උදව් කරන්නම්.\n\n319\n00:34:34,280 --> 00:34:36,074\nකනෙයමාවත්, ශිමානේවත් විදියට නෙවේ...\n\n320\n00:34:36,574 --> 00:34:37,784\nකිම් ගිල් ලොක් විදියට.\n\n321\n00:34:38,785 --> 00:34:39,619\nමට…\n\n322\n00:34:41,412 --> 00:34:43,539\nඇයි ඒක කරලා දෙන්නේ?\n\n323\n00:34:44,415 --> 00:34:46,542\nමරලා දාන්න ඕනෙ කීපදෙනෙක් ඉන්නවා...\n\n324\n00:34:47,376 --> 00:34:49,045\nකිම් ගිල් ලොක් මහත්තයා.\n\n325\n00:34:51,339 --> 00:34:53,257\nචා යොන්ග් දෝට වැඩ කරන\nඋන් ඉන්න තැන හොයාගත්තා.\n\n326\n00:34:53,758 --> 00:34:56,094\nඒ කාර් එක පස්සෙන් ගියොත් චා\nයොන්ග් දෝව හොයාගන්න පුළුවන් වෙයි.\n\n327\n00:34:56,636 --> 00:34:58,387\nමේ ඇත්තටම අන්තිම වතාව.\n\n328\n00:35:22,120 --> 00:35:23,079\nඅරගත්තද?\n\n329\n00:35:23,663 --> 00:35:25,248\nඅරගෙන එන ගමන් සර්.\n\n330\n00:35:25,331 --> 00:35:27,083\nකවුරුවත් පස්සෙන් එන්නැති\nවෙන්න පරිස්සම් වෙන්න.\n\n331\n00:35:27,166 --> 00:35:28,584\nහරි සර්, ඉක්මනටම එන්නම්.\n\n332\n00:35:35,466 --> 00:35:38,553\nමේ පොඩි එකා නම් අම්මපා.\n\n333\n00:35:43,474 --> 00:35:46,477\n<font color=\"#11ebff\">ජූවුන් ගෲප් JW ගැලරිය\nමුදල් විශුද්ධිකරණ වාර්තාව</font>\n\n334\n00:36:18,801 --> 00:36:22,180\n<b><font face=\"Bell MT\" color=\"#ff0012\">MERCY FOR NONE</font></b>\n\n335\n00:36:23,097 --> 00:36:26,642\nලී සභාපතිතුමාගේ පුතා\nකොහොමද මාව හොයාගත්තේ?\n\n336\n00:36:26,726 --> 00:36:29,687\nනෑ නෑ, මොකද මාව හොයාගෙන ආවේ?\n\n337\n00:36:32,190 --> 00:36:36,194\nපොලිස් අභ්‍යන්තර කටයුතු කණ්ඩායමෙන්\nඔයා ගැන විමර්ශනයක් කරන්නයි ඉන්නේ.\n\n338\n00:36:37,445 --> 00:36:40,114\nඒක.. මන් යටගහලා දෙන්නම්.\n\n339\n00:36:42,116 --> 00:36:45,077\nමාර නිර්භීතකමක්නේ තියෙන්නේ.\n\n340\n00:36:46,537 --> 00:36:47,371\nඉතින්...\n\n341\n00:36:48,289 --> 00:36:49,332\nඔයාට ඕනෙ දේ මොකද්ද?\n\n342\n00:36:54,253 --> 00:36:55,254\nතැනක්.\n\n343\n00:36:57,381 --> 00:36:58,216\nතැනක්?\n\n344\n00:36:58,299 --> 00:37:00,801\nජූවුන් එකයි, බොන්ග්සන් එකයි එකතු කරලා...\n\n345\n00:37:01,469 --> 00:37:02,970\nඉහළම තැනේ වාඩි වෙන්නයි ඕනෙ.\n\n346\n00:37:24,825 --> 00:37:26,077\nසැලැස්ම...\n\n347\n00:37:27,578 --> 00:37:29,372\nමගේ විදියට හදමුද?\n\n348\n00:37:31,958 --> 00:37:32,792\nනැහැ.\n\n349\n00:37:34,669 --> 00:37:35,836\nසැලැස්මක් තියෙනවා.\n\n350\n00:37:38,214 --> 00:37:39,840\nගු ජුන් මෝව පාවිච්චි කරලා...\n\n351\n00:37:41,133 --> 00:37:43,386\nනම් ගි සොක්ව ඉවරයක් කලාම හරි.\n\n352\n00:37:43,469 --> 00:37:45,012\nනම් ගි සොක්ව මරලා...\n\n353\n00:37:45,096 --> 00:37:48,057\nජූවුන් එකයි, බොන්ග්සන් එකයි\nඅතරේ යුද්ධයක් නිර්මාණය කරනවා?\n\n354\n00:37:49,475 --> 00:37:52,645\nඒක ගොඩක් අවදානම් වැඩියි වගේ නේද?\n\n355\n00:37:54,897 --> 00:37:56,899\nහැමදේටම වඩා වද වෙන කාරණෙ තමා...\n\n356\n00:37:57,900 --> 00:37:59,902\nනම් ගි ජුන් පියවරක් අරගනීවි.\n\n357\n00:38:08,244 --> 00:38:11,038\nමගේ තාත්තා හැමවෙලේම කියන දෙයක් තිබුනා.\n\n358\n00:38:12,415 --> 00:38:15,835\nඑයාට ඕනෙ කරපු දේවල්වලින්\nලබාගන්න බැරි වුන දේවල් තිබ්බට...\n\n359\n00:38:16,502 --> 00:38:21,507\nමට ඕනෙ කරන දෙයක් තියේ නම්\nසේරම ලබාගන්න පුළුවන් කියලා.\n\n360\n00:38:23,509 --> 00:38:24,427\nඒවුනාට...\n\n361\n00:38:25,511 --> 00:38:28,055\nඇත්තටම මට මොකද්ද ඕනෙ කියලා...\n\n362\n00:38:29,056 --> 00:38:30,349\nකවදාවත් අහලා නැහැ.\n\n363\n00:38:32,893 --> 00:38:34,478\nමන් ආයෙත් කියන්නම්.\n\n364\n00:38:35,813 --> 00:38:41,527\nමට ජූවුන් එකයි, බොන්ග්සන් එකයි දෙකම ඕනෙ.\n\n365\n00:39:14,435 --> 00:39:16,187\n<b>ගු ජුන් මෝව පාවිච්චි කරලා...</b>\n\n366\n00:39:17,480 --> 00:39:19,899\n<b>නම් ගි සොක්ව ඉවරයක් කලාම හරි.</b>\n\n367\n00:39:22,443 --> 00:39:24,028\n<b>මන් ආයෙත් කියන්නම්.</b>\n\n368\n00:39:24,111 --> 00:39:28,908\n<b>මට ජූවුන් එකයි, බොන්ග්සන් එකයි දෙකම ඕනෙ.</b>\n\n369\n00:39:37,917 --> 00:39:38,793\n<font color=\"#11ebff\">ලී ජූ වුන්</font>\n\n370\n00:39:38,876 --> 00:39:40,169\n<font color=\"#11ebff\">ගු බොන්ග් සන්</font>\n\n371\n00:39:42,671 --> 00:39:44,340\n<font color=\"#11ebff\">ලී ගුම් සොන්</font>\n\n372\n00:39:45,091 --> 00:39:46,842\nඉස්සරහට හොදට එකතු වෙලා වැඩක් කරමු...\n\n373\n00:39:48,135 --> 00:39:49,470\nඅභිචෝදක මහත්තයෝ.\n\n374\n00:39:55,456 --> 00:45:45,456\n<b><font color=\"#ff5900\">♥පරිවර්තනය සහ උපසිරැසි ගැන්වීම♥</font>\n<font color=\"#28ff69\">෴නයන බුද්ධික෴</font>\n<font color=\"#6638ff\">B a i s c o p e l k</font></b>\n\n";
/* ===================================== */

const $ = id => document.getElementById(id);
const vid = $('vid'), notice = $('notice'), statusEl = $('status');
let cues = [], offset = 0, trackEl = null, blobUrl = null;

function driveId(s){
  const m = s.match(/\/d\/([\w-]+)/) || s.match(/[?&]id=([\w-]+)/);
  return m ? m[1] : null;
}
function loadVideo(link){
  notice.classList.remove('on');
  const stage = $('stage');
  if(!stage.contains(vid)){ stage.innerHTML=''; stage.append(vid, notice); }
  const id = driveId(link);
  vid.src = id
    ? 'https://drive.usercontent.google.com/download?id=' + id + '&export=download&confirm=t'
    : link;
  vid.dataset.driveId = id || '';
  vid.load();
}
vid.addEventListener('error', () => { if(vid.src) notice.classList.add('on'); });
vid.addEventListener('playing', () => notice.classList.remove('on'));
$('useIframe').onclick = () => {
  const id = vid.dataset.driveId; if(!id) return;
  $('stage').innerHTML = '<iframe src="https://drive.google.com/file/d/' + id + '/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>';
};

/* ---- SRT / VTT parsing ---- */
function toSec(t){
  const p = t.trim().replace(',', '.').split(':').map(parseFloat);
  return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*60 + p[1];
}
function fmt(s){
  s = Math.max(0, s);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + sec.toFixed(3).padStart(6,'0');
}
function parseSubs(text){
  text = text.replace(/^\uFEFF/, '').replace(/\r/g, '');
  const out = [];
  text.split(/\n\s*\n/).forEach(block => {
    const lines = block.split('\n');
    const i = lines.findIndex(l => l.includes('-->'));
    if(i < 0) return;
    const [a, b] = lines[i].split('-->');
    const body = lines.slice(i+1).join('\n').replace(/<\/?font[^>]*>/gi, '').trim();
    if(body) out.push({ start: toSec(a), end: toSec(b.trim().split(/\s+/)[0]), body });
  });
  return out;
}
function applySubs(){
  if(!cues.length) return;
  const vtt = 'WEBVTT\n\n' + cues.map(c =>
    fmt(c.start + offset) + ' --> ' + fmt(c.end + offset) + '\n' + c.body).join('\n\n');
  if(blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(new Blob([vtt], { type: 'text/vtt' }));
  if(trackEl) trackEl.remove();
  trackEl = document.createElement('track');
  trackEl.kind = 'subtitles'; trackEl.label = 'Sinhala'; trackEl.srclang = 'si';
  trackEl.default = true; trackEl.src = blobUrl;
  vid.appendChild(trackEl);
  trackEl.addEventListener('load', () => { trackEl.track.mode = 'showing'; });
  setTimeout(() => { if(trackEl && trackEl.track) trackEl.track.mode = 'showing'; }, 200);
}
function setSubs(text, name){
  cues = parseSubs(text);
  if(!cues.length){ statusEl.textContent = 'මේ file එකේ subtitles හොයාගන්න බෑ. .srt හෝ .vtt file එකක්ද බලන්න.'; return; }
  offset = 0; $('delay').textContent = '0.0s';
  applySubs();
  statusEl.textContent = '✓ ' + name + ' — lines ' + cues.length + ' ක් load වුණා.';
}

$('subFile').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => setSubs(r.result, f.name);
  r.readAsText(f, 'utf-8');
});
function nudge(d){
  offset = Math.round((offset + d) * 10) / 10;
  $('delay').textContent = (offset > 0 ? '+' : '') + offset.toFixed(1) + 's';
  applySubs();
}
$('earlier').onclick = () => nudge(-0.5);
$('later').onclick = () => nudge(0.5);
$('load').onclick = () => { const v = $('link').value.trim(); if(v) loadVideo(v); };
$('link').addEventListener('keydown', e => { if(e.key === 'Enter') $('load').click(); });

loadVideo(DEFAULT_VIDEO);
if(SUB_TEXT) setSubs(SUB_TEXT, 'Sinhala subtitles');
if(DEFAULT_SUB){
  fetch(DEFAULT_SUB).then(r => r.text()).then(t => setSubs(t, DEFAULT_SUB))
    .catch(() => { statusEl.textContent = 'DEFAULT_SUB file එක load කරන්න බැරි වුණා. උඩින් file එක select කරන්න.'; });
}
</script>
</body>
</html>
